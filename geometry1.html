<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>geometry 1 — Uzor</title>
  <link rel="stylesheet" href="styles.css">
  <script src="geometry1.js" defer></script>
</head>
<body class="geometry-page">
  <div class="geometry-layout">
    <aside class="geometry-controls">
      <a class="geometry-controls__back" href="index.html">← patterns</a>
      <h1>geometry 1</h1>

      <div class="control-group">
        <label for="lineCount">number lines</label>
        <input
          id="lineCount"
          type="number"
          min="1"
          max="30"
          step="1"
          value="20"
          inputmode="numeric"
        >
      </div>

      <div class="control-group">
        <span class="control-group__label">allowed shapes</span>
        <div class="corner-options">
          <button
            id="allow4Button"
            class="option-toggle"
            type="button"
            aria-pressed="true"
          >4 corners</button>
          <button
            id="allow5Button"
            class="option-toggle"
            type="button"
            aria-pressed="false"
          >5 corners</button>
        </div>
      </div>

      <button id="generateButton" class="generate-button" type="button">
        generate
      </button>
    </aside>

    <main class="geometry-stage">
      <canvas id="patternCanvas" aria-label="Сгенерированный геометрический узор"></canvas>
    </main>
  </div>
</body>
</html>
